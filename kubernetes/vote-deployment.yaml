apiVersion: apps/v1
kind: Deployment

metadata:
  name: vote

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote

    spec:
      containers:
        - name: vote
          image: sketcherrp/voting-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: REDIS_HOST
              value: redis

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
